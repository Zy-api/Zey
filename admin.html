<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flash Toolbox · 后台管理</title>
<style>
  :root{--bg:#0d0d0d;--panel:#151515;--card:#1c1c1c;--border:#2a2a2a;--accent:#c8a45c;--accent2:#d4af6a;--text:#ececec;--text2:#9a9a9a;--text3:#666;--radius:12px;--danger:#e05555}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5;overflow-x:hidden}
  html{max-width:100vw}
  body{background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(200,164,92,.06),transparent 60%),var(--bg);overflow-y:auto;overflow-x:hidden;width:100%;max-width:100vw}
  .wrap,.repo-bar,.topbar-inner{max-width:100%}
  a{color:inherit;text-decoration:none}
  svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(13,13,13,.82);border-bottom:1px solid var(--border)}
  .topbar-inner{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  @media(max-width:700px){.topbar-inner{flex-direction:column;align-items:stretch;gap:10px}.top-actions{justify-content:flex-end;flex-wrap:wrap}.brand{justify-content:flex-start;flex-wrap:wrap}}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;min-width:0}
  .brand .ic{width:30px;height:30px;color:var(--accent)}
  .brand small{color:var(--text3);font-weight:500;font-size:12px;margin-left:4px}
  .top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  @media(max-width:700px){.top-actions{width:100%;justify-content:flex-end;gap:8px}.top-actions .btn{flex:0 0 auto;max-width:100%}}
  .status{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px}
  .status .dot{width:7px;height:7px;border-radius:50%;background:#444}
  .status.loaded .dot{background:var(--green,#3ecf6e);box-shadow:0 0 6px var(--green,#3ecf6e)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.2s;white-space:nowrap}
  .btn svg{width:16px;height:16px}
  .btn-primary{background:var(--accent);color:#1a1a1a}
  .btn-primary:hover{background:var(--accent2)}
  .btn-ghost{color:var(--text2);border:1px solid var(--border);background:transparent}
  .btn-ghost:hover{color:var(--text);border-color:#3a3a3a}
  .btn-sm{padding:7px 11px;font-size:12px}
  .repo-bar{max-width:1100px;margin:0 auto;padding:14px 18px}
  .repo-bar .box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
  .repo-bar h4{font-size:13px;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .repo-bar h4 svg{width:16px;height:16px}
  .repo-grid{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:10px}
  @media(max-width:760px){.repo-grid{grid-template-columns:1fr}}
  .inp{display:flex;flex-direction:column;gap:5px}
  .inp label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
  .inp input,.inp select,.inp textarea{background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-size:13px;font-family:inherit;width:100%}
  .inp textarea{resize:vertical;min-height:60px}
  .inp input:focus,.inp select:focus,.inp textarea:focus{outline:none;border-color:var(--accent)}
  .hint{font-size:11px;color:var(--text3);margin-top:8px}
  .wrap{max-width:1100px;margin:0 auto;padding:8px 18px 40px}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0;flex-wrap:wrap}
  @media(max-width:700px){.toolbar{flex-direction:column;align-items:stretch}.toolbar .search{max-width:none;width:100%}.toolbar .tabs{justify-content:flex-start;flex-wrap:wrap}.toolbar .stat{text-align:left}}
  .search{flex:1;position:relative;max-width:420px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3)}
  .search input{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 12px 10px 34px;border-radius:9px;font-size:13px}
  .search input:focus{outline:none;border-color:var(--accent)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{padding:7px 13px;border-radius:8px;font-size:12px;color:var(--text2);background:var(--panel);border:1px solid var(--border);cursor:pointer}
  .tab.active{color:var(--accent);border-color:rgba(200,164,92,.4);background:rgba(200,164,92,.08)}
  .stat{font-size:12px;color:var(--text3);white-space:nowrap}
  .group{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
  .group-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;user-select:none;border-bottom:1px solid transparent}
  .group.open .group-head{border-bottom-color:var(--border)}
  .group-head .l{display:flex;align-items:center;gap:10px}
  .group-head .l .gh{width:22px;height:22px;color:var(--accent)}
  .group-head h3{font-size:15px;font-weight:700}
  .group-head .tag{font-size:10px;color:var(--text3);background:var(--card);border:1px solid var(--border);padding:2px 8px;border-radius:10px;margin-left:8px}
  .group-head .caret{width:18px;height:18px;color:var(--text3);transition:transform .25s}
  .group.open .caret{transform:rotate(90deg)}
  .group-body{padding:6px 16px 16px;display:none}
  .group.open .group-body{display:block}
  .row{display:grid;grid-template-columns:200px 1fr 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .row:last-child{border-bottom:none}
  .row .key{font-size:12px;color:var(--text3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;padding-top:9px}
  .row .key b{color:var(--text2);font-weight:600}
  .row label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
  .row input,.row textarea,.row select{flex:1}
  .lang-col{display:flex;flex-direction:column;gap:2px}
  .add-row{display:flex;justify-content:flex-end;margin-top:8px}
  .item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
  .item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
  .item-head .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
  .item-head .t .ih{width:18px;height:18px;color:var(--accent)}
  .item-head .acts{display:flex;gap:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  @media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
  .mini-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;display:block}
  /* 图标选择器 */
  .icon-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .icon-pick .opt{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);padding:0;transition:.15s}
  .icon-pick .opt svg{width:18px;height:18px}
  .icon-pick .opt:hover{border-color:#3a3a3a;color:var(--text)}
  .icon-pick .opt.active{border-color:var(--accent);color:var(--accent);background:rgba(200,164,92,.12);box-shadow:0 0 0 1px var(--accent)}
  .icon-pick .opt.active:hover{border-color:var(--accent)}
  .icon-url-box{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .icon-url-box input{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:8px;font-size:12px;width:100%}
  .icon-url-box .prev-row{display:flex;align-items:center;gap:8px}
  .icon-url-box .prev-img{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);object-fit:contain;display:none;background:var(--bg)}
  .icon-url-box .prev-img.show{display:block}
  .up-box{border:1px dashed var(--border);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
  .up-box .prev{width:40px;height:40px;object-fit:cover;border-radius:8px;display:none}
  .up-box.hasimg .prev{display:block}
  .switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
  .switch input{accent-color:var(--accent)}
  .danger{color:var(--danger);border-color:rgba(224,85,85,.35)}
  .danger:hover{background:rgba(224,85,85,.1)!important;color:var(--danger)!important;border-color:var(--danger)!important}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1a1a;border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:300;display:flex;align-items:center;gap:8px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:16px;height:16px;color:var(--green,#3ecf6e)}
  .footer-note{font-size:11px;color:var(--text3);text-align:center;margin-top:24px}
  .sub-group{font-size:12px;color:var(--accent);margin:6px 0 8px;padding-left:4px}
  /* 滑块 */
  .slider-row{display:flex;align-items:center;gap:10px;margin-top:4px}
  .slider-row label.sl{font-size:11px;color:var(--text3);min-width:60px;flex-shrink:0}
  .slider-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--border);outline:none}
  .slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
  .slider-row input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
  .slider-row .val{font-size:12px;color:var(--accent);min-width:36px;text-align:right;font-weight:700}
  .slider-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
  @media(max-width:700px){.slider-grid{grid-template-columns:1fr}}
  .icon-section-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px;display:flex;align-items:center;gap:6px}
  .icon-section-label svg{width:14px;height:14px;color:var(--accent)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 22V12"/><path d="M12 12L3 7"/><path d="M12 12l9-5"/></svg>
      Flash<span style="color:var(--accent)">Toolbox</span>
      <small>后台管理</small>
    </div>
    <div class="top-actions">
      <span class="status" id="status"><span class="dot"></span><span id="statusText">未加载</span></span>
      <button class="btn btn-ghost btn-sm" id="exportBtn" title="导出 data.json"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出 JSON</button>
      <button class="btn btn-primary btn-sm" id="saveBtn"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>保存修改</button>
    </div>
  </div>
</div>

<div class="repo-bar">
  <div class="box">
    <h4><svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>GitHub 仓库设置（用于一键推送 data.json 同步前台）</h4>
    <div class="repo-grid">
      <div class="inp"><label>GitHub Token（需 repo 权限，仅存内存）</label><input id="rToken" type="password" placeholder="ghp_..." autocomplete="off"></div>
      <div class="inp"><label>仓库 owner/repo</label><input id="rRepo" placeholder="Zy-api/Zey"></div>
      <div class="inp"><label>分支 / 文件路径</label><input id="rBranch" value="main" style="margin-bottom:6px"><input id="rPath" value="data.json" placeholder="data.json 路径"></div>
    </div>
    <div class="hint">提示：Token 获取 -> GitHub Settings -> Developer settings -> Personal access tokens -> Tokens (classic) -> 勾选 <b>repo</b>。不想填 Token 可用右上角"导出 JSON"后手动上传回仓库。</div>
  </div>
</div>

<div class="wrap">
  <div class="toolbar">
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input id="search" placeholder="搜索 key 或内容..."></div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-f="all">全部</button>
      <button class="tab" data-f="zh">仅中文</button>
      <button class="tab" data-f="en">仅英文</button>
    </div>
    <div class="stat" id="stat">共 0 条 · 已修改 0 条</div>
  </div>

  <div id="groups"></div>

  <div class="footer-note">Flash Toolbox 后台 · 修改后点"保存修改"经 GitHub API 推送 data.json，前台下次加载自动同步生效。</div>
</div>

<div class="toast" id="toast"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span id="toastText">已保存</span></div>

<script>
var DATA_URL = 'data.json';
var data = null; var modified = {}; var curFilter = 'all'; var curSearch = '';
// 扩展图标库：内置 SVG 图标 + 支持 URL 链接
var ICON_KEYS = ['cube','shield','package','bolt','download','gear','globe','paperplane','check','layers','terminal','flame','rocket','star','heart','zap','cpu','database','lock','shield-check','activity','server','code','tool','wrench','moon','sun','cloud','award','target','trending-up','thunderbolt'];
var ICON_SVG = {};
function el(s){return document.querySelector(s)}
function all(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function showToast(msg){el('#toastText').textContent=msg;el('#toast').classList.add('show');setTimeout(function(){el('#toast').classList.remove('show')},2200)}
function svg(name,size){size=size||18;var raw=ICON_SVG[name]||ICON_SVG.cube||'';var m=raw.match(/viewBox='([^']+)'/);var vb=m?m[1]:'0 0 24 24';var inner=raw.replace(/<svg[^>]*>/,'').replace(/<\/svg>/,'');return '<svg width="'+size+'" height="'+size+'" viewBox="'+vb+'">'+inner+'</svg>'}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function unesc(s){return String(s||'').replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&')}

fetch(DATA_URL,{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){
  data=d; ICON_SVG=data.icons||{};
  el('#status').classList.add('loaded'); el('#statusText').textContent='已加载';
  render();
}).catch(function(err){window.__adminLastLoadErr__=err;var st=el('#statusText');if(st){st.textContent='加载失败'}var stat=el('#stat');var reason='';if(err&&/Failed to fetch/i.test(String(err.message||err))){reason='：网络错误，请确认 data.json 与 admin.html 同目录且已通过 GitHub Pages 发布'}else if((err&&/Unexpected token/i.test(String(err.message||err)))||/JSON/i.test(String(err.message||err))){reason='：data.json 解析失败（内容可能为空或非合法 JSON）'}else{reason='：'+String((err&&err.message)||err)}if(stat){stat.textContent='共 0 条 · 已修改 0 条'}console.error('[admin] data.json 加载失败'+reason+(err&&err.stack?'\n'+err.stack:''),err)});

function setMod(key,val){modified[key]=val}
function isMod(key){return key in modified}

/* ---------- 渲染分组 ---------- */
function render(){
  var g=el('#groups'); g.innerHTML='';
  var secs=buildSections();
  secs.forEach(function(sec){g.appendChild(renderSection(sec))});
  updateStat();
}

function buildSections(){
  var c=data.content||{}; var zh=c.zh||{}; var en=c.en||{};
  var keys=Object.keys(zh);
  // 列表项模板（供 nav/menu 分组配置 itemTpl 引用；实际列表渲染由 renderItems/fieldGrid 完成，此处仅保证引用可解析）
  function navItemTpl(it,idx){return '<div class="item"><div class="item-head"><span>'+esc(it.labelZh||it.key||('导航项 '+idx))+'</span></div></div>';}
  function menuItemTpl(it,idx){return '<div class="item"><div class="item-head"><span>'+esc(it.labelZh||it.key||('菜单项 '+idx))+'</span></div></div>';}
  var secs=[
    {id:'brand',name:'站点品牌 / Logo',tag:'brand',icon:'cube',rows:[
      {k:'brand.flash',label:'Logo 文字（Flash）',get:function(){return (data.brand||{}).flash||'Flash'},set:function(v){(data.brand=data.brand||{}).flash=v}},
      {k:'brand.toolbox',label:'Logo 文字（Toolbox）',get:function(){return (data.brand||{}).toolbox||'Toolbox'},set:function(v){(data.brand=data.brand||{}).toolbox=v}},
      {k:'brand.logoIcon',label:'Logo 图标（选 SVG 图标库）',iconPick:true,get:function(){return (data.brand||{}).logoIcon||'cube'},set:function(v){(data.brand=data.brand||{}).logoIcon=v}}
    ]},
    {id:'nav',name:'顶部导航菜单',tag:'nav',icon:'layers',list:'nav',itemTpl:navItemTpl,items:function(){return data.nav||[]},setItems:function(v){data.nav=v}},
    {id:'menu',name:'主菜单 / 下载面板菜单',tag:'menu',icon:'terminal',list:'menu',itemTpl:menuItemTpl,items:function(){return data.menu||[]},setItems:function(v){data.menu=v}},
    {id:'hero',name:'首屏 Hero（标题/描述/按钮）',tag:'hero',icon:'flame',rows:pickKeys(keys,['hero.badge','hero.title','hero.desc','hero.btn','hero.m1','hero.m2','hero.m3'])},
    {id:'sec1',name:'区块一 · 关于紫罗兰',tag:'sec1',icon:'shield',rows:pickKeys(keys,['sec1.index','sec1.heading','sec1.sub','card1.title','card1.version','card1.desc','card1.meta1','card1.meta2','card1.btn'])},
    {id:'sec2',name:'区块二 · 常用模块（环境）',tag:'env',icon:'layers',rows:pickKeys(keys,['sec2.index','sec2.heading','sec2.sub','env1.title','env1.desc','env2.title','env2.desc','env3.title','env3.desc','env4.title','env4.desc'])},
    {id:'sec3',name:'区块三 · 系统架构',tag:'arch',icon:'cube',rows:pickKeys(keys,['sec3.index','sec3.heading1','sec3.heading2','sec3.desc','arch1.title','arch1.desc','arch2.title','arch2.desc','arch3.title','arch3.desc'])},
    {id:'cta',name:'底部 CTA 横幅',tag:'cta',icon:'bolt',rows:pickKeys(keys,['cta.title','cta.desc','cta.btn1','cta.btn2'])},
    {id:'footer',name:'页脚',tag:'footer',icon:'globe',rows:pickKeys(keys,['footer.copy','footer.home','footer.download','footer.module','footer.toolbox','footer.help','footer.tg'])},
    {id:'toast',name:'提示 Toast 文案',tag:'toast',icon:'check',rows:pickKeys(keys,['toast.fetch','toast.welcome','toast.advantages','toast.download','toast.success'])},
    {id:'dl',name:'下载中心面板',tag:'dl',icon:'download',rows:pickKeys(keys,['dl.subtitle','dl.title','dl.desc','dl.available','dl.projects','dl.v109','dl.support.title','dl.support.desc','dl.contact.online','dl.contact.email','dl.contact.send','dl.slogan','dl.col1','dl.nav.home','dl.nav.download','dl.nav.features','dl.col2','dl.nav.help','dl.nav.email','dl.copyright','dl.card1.title','dl.card1.desc','dl.card1.detail','dl.card1.download','dl.card2.title','dl.card2.desc','dl.card2.detail','dl.card2.download','dl.f1','dl.f2','dl.f3','dl.f4','dl.f6','dl.f7'])}
  ];
  return secs;
}
function pickKeys(allKeys,want){return want.filter(function(k){return allKeys.indexOf(k)>=0}).map(function(k){return {k:k,label:k}})}
function renderSection(sec){
  var wrap=document.createElement('div'); wrap.className='group open';
  var head=document.createElement('div'); head.className='group-head';
  head.innerHTML='<div class="l"><span class="gh">'+svg(sec.icon||'cube',22)+'</span><h3>'+esc(sec.name)+'</h3><span class="tag">'+(sec.tag||'')+'</span></div><span class="caret">'+svg('caret',18)+'</span>';

function saveToGithub(token,repo,branch,path,dataObj){return new Promise(function(resolve,reject){var api='https://api.github.com/repos/'+encodeURI(repo)+'/contents/'+encodeURI(path);fetch(api+'?ref='+encodeURIComponent(branch),{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json'}}).then(function(r){if(r.status===404)return null;if(!r.ok)return r.json().then(function(j){throw new Error(j.message||'获取文件失败')});return r.json()}).then(function(info){var body={message:'update data.json from admin',content:btoa(unescape(encodeURIComponent(JSON.stringify(dataObj,null,2)))),branch:branch};if(info&&info.sha)body.sha=info.sha;return fetch(api,{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)})}).then(function(r){if(!r.ok)return r.json().then(function(j){throw new Error(j.message||'推送失败')});return r.json()}).then(function(){resolve()}).catch(reject)})}

<!-- Flash Toolbox 后台 · 增量修补（不改原有代码，独立 script 块追加在原 script 之后） -->
<script>
/* ===== Flash Toolbox 后台 · 增量修补（不改原有代码，仅追加此块） =====
 * 修复：
 *  1) 仓库地址自动规范化（去掉 https://github.com/ 等前缀，只保留 owner/repo）
 *  2) 中文内容用标准 UTF-8→Base64 编码（替换原 btoa(unescape(encodeURIComponent()))）
 *  3) Token / 仓库 / 分支 / 路径 写入 localStorage，刷新后自动回填（不丢失）
 *  4) 推送失败给出具体原因（Token 权限 / 仓库不存在 / 网络错误）
 *  5) 加载 data.json 失败时提示更明确
 */
(function () {
  var LS = 'ft_repo_cfg_v1';
  // ---- UTF-8 安全 Base64 ----
  function utf8ToB64(str) {
    var bytes = new (typeof TextEncoder !== 'undefined' ? TextEncoder : function () { this.encode = function (s) { return unescape(encodeURIComponent(s)); }; })(str).encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function normRepo(raw) {
    var v = (raw || '').trim().replace(/\s+/g, '');
    if (!v) return '';
    if (/^https?:\/\//i.test(v)) {
      try { v = new URL(v).pathname.replace(/^\//, ''); } catch (e) { v = v.replace(/^https?:\/\//i, '').replace(/^github\.com\//i, ''); }
    }
    return v.replace(/\/blob\/[^\/]+\//, '/').replace(/\/$/, '');
  }
  // ---- 回填配置 ----
  try {
    var saved = JSON.parse(localStorage.getItem(LS) || 'null');
    if (saved && typeof saved === 'object') {
      var f = function (id, val) { var e = document.getElementById(id); if (e && val != null && !e.value) e.value = val; };
      f('rToken', saved.token); f('rRepo', saved.repo); f('rBranch', saved.branch); f('rPath', saved.path);
    }
  } catch (e) {}
  // ---- 覆盖 saveToGithub 为修复版（原 saveBtn 监听调用的是全局 saveToGithub，覆盖即生效）----
  window.saveToGithub = function (token, repo, branch, path, dataObj) {
    return new Promise(function (resolve, reject) {
      var repoNorm = normRepo(repo);
      if (!repoNorm || repoNorm.indexOf('/') < 0) { reject(new Error('仓库请填 owner/repo，如 Zy-api/Zey')); return; }
      var api = 'https://api.github.com/repos/' + encodeURI(repoNorm) + '/contents/' + encodeURI(path);
      var auth = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' };
      fetch(api + '?ref=' + encodeURIComponent(branch), { headers: auth }).then(function (r) {
        if (r.status === 404) return null;
        if (!r.ok) return r.json().then(function (j) { throw new Error(j.message || ('获取文件失败 ' + r.status)); }).catch(function (e) { throw e; });
        return r.json();
      }).then(function (info) {
        var body = { message: 'update data.json from admin', content: utf8ToB64(JSON.stringify(dataObj, null, 2)), branch: branch };
        if (info && info.sha) body.sha = info.sha;
        return fetch(api, { method: 'PUT', headers: Object.assign({}, auth, { 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
      }).then(function (r) {
        if (!r.ok) return r.json().then(function (j) { throw new Error(j.message || ('推送失败 ' + r.status)); }).catch(function (e) { throw e; });
        resolve();
      }).catch(function (err) { reject(err); });
    });
  };
  // ---- 持久化 + 调用修复版 saveToGithub ----
  function doSave() {
    var token = document.getElementById('rToken').value.trim();
    var repo = document.getElementById('rRepo').value.trim();
    var branch = document.getElementById('rBranch').value.trim() || 'main';
    var path = document.getElementById('rPath').value.trim() || 'data.json';
    if (!token || !repo) { if (window.showToast) window.showToast('请先填写 GitHub Token 与仓库(owner/repo)'); return; }
    try { localStorage.setItem(LS, JSON.stringify({ token: token, repo: repo, branch: branch, path: path })); } catch (e) {}
    window.saveToGithub(token, repo, branch, path, window.data).then(function () {
      if (window.showToast) window.showToast('已推送 data.json，前台将自动同步');
    }).catch(function (err) {
      var msg = (err && err.message) || '';
      var tip = '推送失败';
      if (/401|403/.test(msg)) tip = 'Token 无 repo 权限或已过期';
      else if (/404/.test(msg)) tip = '仓库/分支/路径不存在';
      else if (/Failed to fetch|NetworkError|network/i.test(msg)) tip = '网络或仓库地址错误';
      else if (/owner\/repo/.test(msg)) tip = msg;
      else tip = msg;
      if (window.showToast) window.showToast(tip); else alert(tip);
      console.error('[save]', err);
    });
  }
  // 替换原 saveBtn 点击处理（移除旧监听不可行，改用 flag 让原监听走修复版 saveToGithub 已足够；此处再绑一次确保用我们的 doSave）
  var saveBtn = document.getElementById('saveBtn');
  if (saveBtn) { saveBtn.addEventListener('click', doSave); }
  // 增强加载失败提示（带具体原因）
  var st = document.getElementById('statusText');
  if (st && /加载失败/.test(st.textContent)) {
    var lastErr = (window.__adminLastLoadErr__ && window.__adminLastLoadErr__.message) ? String(window.__adminLastLoadErr__.message) : '';
    st.textContent = '加载失败' + (lastErr ? '（' + lastErr.slice(0, 80) + '）' : '：请确认 data.json 与 admin.html 同目录且已发布');
  }
})();

</script>
