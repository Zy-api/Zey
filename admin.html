<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Flash Toolbox · 后台管理</title>
<style>
  :root{--bg:#0a0a0a;--card:#141414;--border:#232323;--accent:#c8a45c;--text:#e8e8e8;--text2:#999;--text3:#666}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  button:focus,button:active,input:focus,textarea:focus,select:focus{outline:none}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
  .brand svg{width:24px;height:24px;color:var(--accent)}
  .brand span{color:var(--accent)}
  .status{margin-left:auto;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:#444}
  .dot.ok{background:#3ecf6e;box-shadow:0 0 6px #3ecf6e}
  .dot.err{background:#e05555}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .card h3 svg{width:18px;height:18px;color:var(--accent)}
  label{display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:10px 0 4px}
  input[type=text],input[type=password]{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:#0f0f0f;color:var(--text);font-size:13px;min-width:0}
  .hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;transition:.15s;white-space:nowrap;min-width:0}
  .btn svg{width:15px;height:15px}
  .btn-primary{background:var(--accent);color:#1a1a1a}
  .btn-primary:hover{background:#d4af6a} .btn-primary:active{background:#b8934a}
  .btn-ghost{color:var(--text2);border:1px solid var(--border);padding:9px 14px}
  .btn-ghost:hover{color:var(--text);border-color:#3a3a3a}
  .btn:active{transform:translateY(1px)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .sec{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .sec-head{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;background:#111}
  .sec-head svg{width:16px;height:16px;color:var(--accent);flex-shrink:0}
  .sec-head .t{font-weight:700;font-size:13px;flex:1;min-width:0}
  .sec-head .tag{font-size:10px;color:var(--text3);margin-left:6px;font-weight:400}
  .sec-head .arrow{width:14px;height:14px;color:var(--text3);transition:transform .25s}
  .sec.open .arrow{transform:rotate(90deg)}
  .sec-body{padding:12px 14px;display:none}
  .sec.open .sec-body{display:block}
  .row{display:grid;grid-template-columns:170px 1fr 1fr;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .row:last-child{border-bottom:none}
  .row .k{font-size:11px;color:var(--text3);word-break:break-all;padding-top:8px;min-width:0}
  .row textarea{width:100%;min-height:40px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#0f0f0f;color:var(--text);font-size:12px;resize:vertical;min-width:0;font-family:inherit}
  .row .lbl{font-size:10px;color:var(--text3);margin-bottom:2px}
  .col{display:flex;flex-direction:column;min-width:0}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .search{flex:1;min-width:140px;padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:#0f0f0f;color:var(--text);font-size:13px;min-width:0}
  .chip{font-size:12px;padding:7px 12px;border-radius:20px;border:1px solid var(--border);color:var(--text2);background:transparent;transition:.15s}
  .chip.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:700}
  .chip:hover{color:var(--text)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:#161616;border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:300}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .stat{font-size:12px;color:var(--text3);margin-bottom:8px}
  @media(max-width:640px){.row{grid-template-columns:1fr}.row .k{padding-top:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5z"/><path d="M12 22V12"/><path d="M12 12L3 7"/><path d="M12 12l9-5"/></svg>
      Flash <span>Toolbox</span> · 后台
    </div>
    <div class="status"><span class="dot" id="connDot"></span><span id="connTxt">未加载</span></div>
  </div>

  <div class="card">
    <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V6l12-3v12"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="15" r="3"/></svg>GitHub 仓库设置（改内容后推送到此仓库的 data.json）</h3>
    <label>GitHub Token（需 repo 权限，仅存当前页面内存）</label>
    <input id="f_token" type="password" placeholder="ghp_...">
    <label>仓库 owner/repo</label>
    <input id="f_repo" type="text" placeholder="abcd/flash-site" value="">
    <div class="hint">获取 Token：GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic) → Generate new token，勾选 <b>repo</b>。</div>
    <label>分支 / data.json 路径</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input id="f_branch" type="text" placeholder="main" value="main" style="flex:1;min-width:120px">
      <input id="f_path" type="text" placeholder="site/data.json" value="site/data.json" style="flex:2;min-width:180px">
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="btnLoad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>加载数据</button>
      <button class="btn btn-primary" id="btnSave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>保存修改（推送到 GitHub）</button>
      <button class="btn btn-ghost" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出 JSON</button>
    </div>
  </div>

  <div class="toolbar">
    <input class="search" id="search" placeholder="搜索 key 或内容...">
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="zh">仅中文</button>
    <button class="chip" data-f="en">仅英文</button>
  </div>
  <div class="stat" id="stat">共 0 条 · 已修改 0 条</div>
  <div id="sections"></div>
</div>
<div class="toast" id="toast"></div>

<script>
var DATA = {zh:{}, en:{}};
var MODIFIED = {};
var FILTER = 'all';
var SECTIONS = [
  {id:'brand', name:'① 站点品牌/Logo 文字', tag:'修改左上角 Flash/Toolbox 文字', keys:['brand.flash','brand.toolbox']},
  {id:'nav', name:'② 顶部导航菜单', tag:'修改顶部导航项文字(中/英)', keys:['nav.download','nav.env','nav.toolbox','nav.arch']},
  {id:'menu', name:'③ 主菜单/下载面板菜单', tag:'修改主菜单与下载面板菜单项(01-04)', keys:['menu.home','menu.pricing','menu.download','menu.features','menu.help','lang.btn']},
  {id:'hero', name:'④ 首屏 Hero', tag:'修改首屏标题/副标题/按钮文字', keys:['hero.badge','hero.title','hero.desc','hero.btn','hero.m1','hero.m2','hero.m3']},
  {id:'sec', name:'⑤ 区块标题(关于/模块/架构)', tag:'修改三个区块的标题与副标题', keys:['sec1.index','sec1.heading','sec1.sub','sec2.index','sec2.heading','sec2.sub','sec3.index','sec3.heading1','sec3.heading2','sec3.desc']},
  {id:'card', name:'⑥ 主页两张卡片', tag:'修改关于紫罗兰/核心优势卡片', keys:['card1.title','card1.version','card1.desc','card1.meta1','card1.meta2','card1.btn','card2.title','card2.version','card2.desc','card2.meta1','card2.meta2','card2.btn']},
  {id:'env', name:'⑦ 四个环境模块(LSPosed等)', tag:'修改四个环境模块标题与描述', keys:['env1.title','env1.desc','env2.title','env2.desc','env3.title','env3.desc','env4.title','env4.desc']},
  {id:'arch', name:'⑧ 系统架构三层', tag:'修改架构三层标题与描述', keys:['arch1.title','arch1.desc','arch2.title','arch2.desc','arch3.title','arch3.desc']},
  {id:'cta', name:'⑨ 底部 CTA 横幅', tag:'修改底部行动号召标题/按钮', keys:['cta.title','cta.desc','cta.btn1','cta.btn2']},
  {id:'footer', name:'⑩ 页脚', tag:'修改页脚链接与版权文字', keys:['footer.copy','footer.home','footer.download','footer.module','footer.toolbox','footer.help','footer.tg']},
  {id:'toast', name:'⑪ 提示 Toast 文案', tag:'修改各操作的提示文字', keys:['toast.fetch','toast.welcome','toast.advantages','toast.download','toast.success']},
  {id:'dl', name:'⑫ 下载中心面板', tag:'修改下载中心所有文字/卡片/按钮/页脚', keys:['dl.subtitle','dl.title','dl.desc','dl.available','dl.projects','dl.v109','dl.card1.title','dl.card1.desc','dl.f1','dl.f2','dl.f3','dl.f4','dl.card1.detail','dl.card1.download','dl.card2.title','dl.card2.desc','dl.f6','dl.f7','dl.card2.detail','dl.card2.download','dl.support.title','dl.support.desc','dl.contact.online','dl.contact.email','dl.contact.send','dl.slogan','dl.col1','dl.nav.home','dl.nav.download','dl.nav.features','dl.col2','dl.nav.help','dl.nav.email','dl.copyright']},
  {id:'mega', name:'⑬ 主菜单底部(指标/支持)', tag:'修改主菜单底部指标与支持按钮', keys:['mega.tg','mega.metric1','mega.metric2','mega.metric3','mega.support']}
];
var ALLKEYS = []; SECTIONS.forEach(s=>ALLKEYS=ALLKEYS.concat(s.keys));

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2400)}
function setConn(state,msg){document.getElementById('connDot').className='dot '+(state||'');document.getElementById('connTxt').textContent=msg}
function escapeHtml(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

function buildSections(){
  var html='',q=(document.getElementById('search').value||'').toLowerCase(),cnt=0,mod=0;
  SECTIONS.forEach(function(sec){
    var rows='';
    sec.keys.forEach(function(k){
      if(q&&k.toLowerCase().indexOf(q)<0&&(DATA.zh[k]||'').toLowerCase().indexOf(q)<0&&(DATA.en[k]||'').toLowerCase().indexOf(q)<0) return;
      cnt++;
      var m=MODIFIED[k]?1:0; if(m) mod++;
      rows+='<div class="row" data-k="'+escapeHtml(k)+'"><div class="k">'+(m?'<b style="color:var(--accent)">'+escapeHtml(k)+'</b>':escapeHtml(k))+'</div>'
        +'<div class="col"><div class="lbl">简体中文</div><textarea data-lang="zh" placeholder="中文">'+(DATA.zh[k]!==undefined?escapeHtml(DATA.zh[k]):'')+'</textarea></div>'
        +'<div class="col"><div class="lbl">English</div><textarea data-lang="en" placeholder="English">'+(DATA.en[k]!==undefined?escapeHtml(DATA.en[k]):'')+'</textarea></div></div>';
    });
    if(q&&!rows) return;
    html+='<div class="sec open" data-id="'+sec.id+'"><div class="sec-head" onclick="this.parentElement.classList.toggle(\'open\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg><span class="t">'+escapeHtml(sec.name)+'</span><span class="tag">'+(sec.tag||'')+'</span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div><div class="sec-body">'+rows+'</div></div>';
  });
  document.getElementById('sections').innerHTML=html;
  document.getElementById('stat').textContent='共 '+cnt+' 条 · 已修改 '+mod+' 条';
  document.querySelectorAll('.sec-body textarea').forEach(function(ta){
    ta.addEventListener('input', function(){var k=ta.closest('.row').getAttribute('data-k');var lang=ta.getAttribute('data-lang');DATA[lang][k]=ta.value;MODIFIED[k]=1;buildSectionsLight()});
  });
}
function buildSectionsLight(){var q=(document.getElementById('search').value||'').toLowerCase(),cnt=0,mod=0;SECTIONS.forEach(function(sec){sec.keys.forEach(function(k){if(q&&k.toLowerCase().indexOf(q)<0&&(DATA.zh[k]||'').toLowerCase().indexOf(q)<0&&(DATA.en[k]||'').toLowerCase().indexOf(q)<0)return;cnt++;if(MODIFIED[k])mod++})});document.getElementById('stat').textContent='共 '+cnt+' 条 · 已修改 '+mod+' 条'}

document.getElementById('search').addEventListener('input',buildSections);
document.querySelectorAll('.chip').forEach(function(c){c.addEventListener('click',function(){document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});c.classList.add('on');FILTER=c.getAttribute('data-f');buildSections()})});

document.getElementById('btnLoad').addEventListener('click',loadData);
function loadData(){
  var repo=document.getElementById('f_repo').value.trim(),path=document.getElementById('f_path').value.trim();
  var url='';
  if(repo&&path){url='https://api.github.com/repos/'+repo+'/contents/'+encodeURIComponent(path);}
  else {url='data.json';} // 同仓库 Pages 直接读
  setConn('', '加载中...');
  var req=new XMLHttpRequest();req.open('GET',url,true);
  req.onreadystatechange=function(){if(req.readyState!==4)return;
    if(req.status===200){try{var r=JSON.parse(req.responseText);var obj=(r.content?JSON.parse(atob(r.content.replace(/\n/g,''))):r);if(!obj.zh){setConn('err','格式错误：缺 zh');return}DATA={zh:obj.zh,en:obj.en||{}};MODIFIED={};setConn('ok','已加载 '+Object.keys(DATA.zh).length+' 条');buildSections();toast('数据已加载')}catch(e){setConn('err','解析失败')}}
    else {setConn('err','加载失败 '+req.status);toast('加载失败，请检查仓库/路径或先用"导出 JSON"本地导入')}
  };req.send();
}

document.getElementById('btnSave').addEventListener('click',function(){
  var token=document.getElementById('f_token').value.trim(),repo=document.getElementById('f_repo').value.trim(),branch=document.getElementById('f_branch').value.trim()||'main',path=document.getElementById('f_path').value.trim();
  if(!token){toast('请先填写 GitHub Token');return}
  if(!repo||!path){toast('请填写仓库 owner/repo 与路径');return}
  var req=new XMLHttpRequest();req.open('GET','https://api.github.com/repos/'+repo+'/contents/'+encodeURIComponent(path),true);req.setRequestHeader('Authorization','token '+token);
  req.onreadyStateChange=req.onreadystatechange=function(){if(req.readyState!==4)return;var sha=(req.status===200)?(JSON.parse(req.responseText).sha||''):'';
    var content=btoa(unescape(encodeURIComponent(JSON.stringify({_meta:{version:'1.0'},zh:DATA.zh,en:DATA.en},null,2))));
    var body=JSON.stringify({message:'update data.json via admin',content:content,branch:branch,sha:sha});
    var p=new XMLHttpRequest();p.open('PUT','https://api.github.com/repos/'+repo+'/contents/'+encodeURIComponent(path),true);p.setRequestHeader('Authorization','token '+token);p.setRequestHeader('Content-Type','application/json');
    p.onreadystatechange=function(){if(p.readyState!==4)return;if(p.status===200||p.status===201){toast('✅ 已推送到 GitHub，前台刷新即生效');MODIFIED={};buildSectionsLight()}else{toast('❌ 推送失败 '+p.status);console.error(p.responseText)}};p.send(body);
  };req.send();
});

document.getElementById('btnExport').addEventListener('click',function(){var b=new Blob([JSON.stringify({_meta:{version:'1.0'},zh:DATA.zh,en:DATA.en},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.json';a.click()});

// 启动时尝试直接读同目录 data.json（Pages 部署时自动生效）
loadData();
</script>
</body>
</html>
